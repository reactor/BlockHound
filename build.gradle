plugins {
    id 'com.jfrog.artifactory' version '6.0.4' apply false
}

apply from: "$rootDir/gradle/artifactory.gradle"

subprojects {
    apply from: "$rootDir/gradle/publishing.gradle"

    group = "io.projectreactor.tools"

    repositories {
        // On CI use only USW1 (proxies Maven Central) to avoid 429 from Maven Central
        if (System.getenv("GITHUB_ACTION") != null && System.getenv("GITHUB_ACTOR") != "dependabot[bot]") {
            maven {
                name = "usw1-spring-maven-virtual"
                url = "https://usw1.packages.broadcom.com/artifactory/spring-maven-virtual"
                credentials {
                    username = System.getenv("COMMERCIAL_REPO_USERNAME")
                    password = System.getenv("COMMERCIAL_REPO_PASSWORD")
                }
            }
        }
        else {
            mavenCentral()
        }
    }

    tasks.withType(Test).configureEach {
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(13)
        }
        jvmArgs += [
                "-XX:+AllowRedefinitionToAddDeleteMethods"
        ]
    }


    plugins.withType(MavenPublishPlugin) {
        project.publishing {
            repositories {
                maven {
                    url = System.getenv('GRADLE_PUBLISH_REPO_URL')
                    credentials {
                        username = System.getenv('GRADLE_PUBLISH_MAVEN_USER')
                        password = System.getenv('GRADLE_PUBLISH_MAVEN_PASSWORD')
                    }
                }
            }
        }
    }

    tasks.withType(GenerateModuleMetadata).configureEach {
        enabled = false
    }
}

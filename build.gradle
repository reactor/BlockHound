plugins {
    id 'com.jfrog.artifactory' version '6.0.4' apply false
}

apply from: "$rootDir/gradle/artifactory.gradle"

subprojects {
    apply from: "$rootDir/gradle/publishing.gradle"

    group = "io.projectreactor.tools"

    repositories {
        mavenCentral()
        if (System.getenv("RELEASE_TRAIN_MAVEN_REPOSITORY_URL") != null) {
            maven {
                name = "Release Train"
                url = System.getenv("RELEASE_TRAIN_MAVEN_REPOSITORY_URL")
                credentials {
                    username = System.getenv("RELEASE_TRAIN_MAVEN_REPOSITORY_USERNAME")
                    password = System.getenv("RELEASE_TRAIN_MAVEN_REPOSITORY_PASSWORD")
                }
            }
        }
    }

    tasks.withType(Test).configureEach {
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of((findProperty('testToolchainVersion') ?: 13) as int)
        }
        jvmArgs += [
                "-XX:+AllowRedefinitionToAddDeleteMethods"
        ]
    }


    plugins.withType(MavenPublishPlugin) {
        project.publishing {
            repositories {
                maven {
                    url = System.getenv('GRADLE_PUBLISH_REPO_URL')
                    credentials {
                        username = System.getenv('GRADLE_PUBLISH_MAVEN_USER')
                        password = System.getenv('GRADLE_PUBLISH_MAVEN_PASSWORD')
                    }
                }
                if (project.hasProperty("deploymentRepository")) {
                    maven {
                        name = 'Deployment'
                        url = project.property("deploymentRepository")
                    }
                }
            }
        }
    }

    tasks.withType(GenerateModuleMetadata).configureEach {
        enabled = false
    }
}

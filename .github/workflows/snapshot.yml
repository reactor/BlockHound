name: Snapshot

on:
  push:
    branches:
      - master-internal

permissions: read-all

jobs:
  checkSnapshot:
    runs-on: ubuntu22-2-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 13
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '13' # Modern JVM is needed for Java 10+ specific tests
          distribution: 'zulu'
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Run tests and javadoc
        run: ./gradlew check javadoc
  publishSnapshot:
    runs-on: ubuntu22-2-8
    needs: checkSnapshot
    environment: snapshot
    env: #change this after a release
      BLOCKHOUND_VERSION: 1.0.18.BUILD-INTERNAL-SNAPSHOT
    steps:
      - name: check version
        if: ${{ !endsWith(env.BLOCKHOUND_VERSION, '.BUILD-INTERNAL-SNAPSHOT') }}
        run: |
          echo "::error ::$BLOCKHOUND_VERSION is not following the x.y.z.BUILD-INTERNAL-SNAPSHOT format"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Publish Snapshot
        run: ./gradlew --no-daemon -Pversion=$BLOCKHOUND_VERSION assemble artifactoryPublish -Partifactory_publish_contextUrl=https://usw1.packages.broadcom.com -Partifactory_publish_repoKey=spring-enterprise-maven-dev-local
        env:
          ORG_GRADLE_PROJECT_artifactory_publish_username: ${{secrets.COMMERCIAL_ARTIFACTORY_USERNAME}}
          ORG_GRADLE_PROJECT_artifactory_publish_password: ${{secrets.COMMERCIAL_ARTIFACTORY_PASSWORD}}
